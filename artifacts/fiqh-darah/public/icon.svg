<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Rounded elegant background -->
  <rect width="512" height="512" rx="112" fill="#ffffff" />
  
  <!-- Outer glowing rings representing a 30-day lunar/menstrual cycle calendar -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#f43f5e" stroke-width="8" stroke-opacity="0.25" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.15" />

  <!-- Crescent moon in soft gold representing the Islamic calendar/calculations -->
  <path d="M 330 200 A 90 90 0 0 1 200 330 A 100 100 0 0 0 330 200 Z" fill="#fbbf24" opacity="0.8" />

  <!-- A stylized blood droplet representing fiqh darah -->
  <path d="M 256 120 C 256 120 350 250 350 310 C 350 361.9 307.9 404 256 404 C 204.1 404 162 361.9 162 310 C 162 250 256 120 256 120 Z" fill="url(#bloodGrad)" />
  
  <!-- Stylized mathematical symbols inside the droplet to represent calculator -->
  <!-- Plus (+) -->
  <path d="M 244 266 L 268 266 M 256 254 L 256 278" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.95" />
  <!-- Minus (-) -->
  <path d="M 210 310 L 230 310" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85" />
  <!-- Equals (=) -->
  <path d="M 276 306 L 296 306 M 276 314 L 296 314" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85" />
</svg>
